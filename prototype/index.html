<script>
  // Theme and motion before first paint: ?theme= / ?motion= win, then saved choices, else the OS.
  (function () {
    var q = new URLSearchParams(location.search), t = q.get('theme'), m = q.get('motion');
    try { t = t || localStorage.getItem('keel-theme'); m = m || localStorage.getItem('keel-motion'); } catch (e) {}
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    if (m === 'reduced') document.documentElement.setAttribute('data-motion', 'reduced');
  })();
</script>
<!-- Shared, framework-free modules: the Lottie player custom element and the data-bound charts -->
