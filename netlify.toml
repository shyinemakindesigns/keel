# Vite + React build. Pages not yet ported to React are copied into dist as they are
# (scripts/copy-static.mjs), so one deploy serves the whole site.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/assets/rive/*"
  [headers.values]
    Content-Type = "application/octet-stream"

[[headers]]
  for = "/_app/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The prototype used to live at /prototype.html. A file by that name next to
# /prototype/index.html makes Netlify's pretty URLs loop, so the old address is a
# redirect rule instead of a page. The query string (?screen=plan) carries over.
[[redirects]]
  from = "/prototype.html"
  to = "/prototype/"
  status = 301
  force = true
