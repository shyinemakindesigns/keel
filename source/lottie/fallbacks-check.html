<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fallback check</title>
<style>body{margin:0;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:6px;background:#888}img{width:100%;background:#F6F3ED}img.d{background:#202725}</style></head>
<body><!-- Dev tool: every static fallback as a plain <img>, light then dark. -->
<script>
['equilibrium','line','clarity','goal','check','empty','goal-created','loading','onboarding','signature','complete','keel-settle'].forEach(function(n){
  ['', '-dark'].forEach(function(t){ var i=document.createElement('img'); i.src='../../assets/fallbacks/'+n+t+'.svg'; if(t) i.className='d'; document.body.appendChild(i); });
});
</script></body></html>
