<script>
  // Before first paint, so there is no flash: dark unless light was chosen.
  (function () {
    var d = document.documentElement, t = null, m = null;
    try { t = localStorage.getItem('keel-theme'); m = localStorage.getItem('keel-motion'); } catch (e) {}
    d.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
    if (m === 'reduced' || m === 'full') d.setAttribute('data-motion', m);
  })();
</script>
