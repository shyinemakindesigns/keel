<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keel thumbnails</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=switzer@400,401,500,501,600&amp;display=swap" rel="stylesheet">
<!--
  #thumb  1600 x 1200  portfolio grid thumbnail (Wix)
  #og     1200 x 630   link preview (og:image) for LinkedIn and others
  The page's waterline is placed on the same line as the waterline inside the
  app screenshot, so the scene and the product read as one surface.
  Screenshot waterline: y = 824 of 2532 (app-home.png, 1170 px wide).
-->
<style>
  :root { --abyss: #0B1530; --water: #112358; --on-dark: #F4F5FA; --frost: #AEB9D6; --accent: #F1FF62;
          --serif: "Switzer", system-ui, sans-serif; --sans: "Switzer", system-ui, sans-serif; }
  body { margin: 0; background: #777; font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  .art { position: relative; overflow: hidden; background: var(--abyss); color: var(--on-dark); }
  .water { position: absolute; left: 0; right: 0; bottom: 0; background: var(--water); border-top: 3px solid var(--on-dark); }
  .phone { position: absolute; overflow: hidden; background: #F4F5FA; border: 2px solid rgba(244,245,250,.22); }
  .phone img { display: block; width: 100%; }
  .wm { display: flex; align-items: center; font-family: var(--serif); font-weight: 400; letter-spacing: -0.02em; font-weight: var(--display-weight, 400); letter-spacing: var(--display-tracking, -0.01em); margin: 0; }
  .tag { font-family: var(--serif); font-weight: var(--display-weight, 400); letter-spacing: var(--display-tracking, -0.01em); margin: 0; }
  .tag em { color: var(--accent); }
  .meta { color: var(--frost); margin: 0; }

  #thumb { width: 1600px; height: 1200px; }
  #thumb .water { top: 546px; }
  #thumb .phone { width: 520px; left: 980px; top: 180px; height: 1100px; border-radius: 56px; }
  #thumb .wm { position: absolute; left: 110px; top: 230px; font-size: 230px; line-height: 1; gap: 34px; }
  #thumb .wm svg { width: 170px; height: 94px; margin-top: 30px; }
  #thumb .tag { position: absolute; left: 110px; top: 640px; width: 780px; font-size: 64px; line-height: 1.12; }
  #thumb .meta { position: absolute; left: 110px; top: 1010px; font-size: 30px; }

  #og { width: 1200px; height: 630px; margin-top: 40px; }
  #og .water { top: 323px; }
  #og .phone { width: 360px; left: 760px; top: 70px; height: 700px; border-radius: 40px; }
  #og .wm { position: absolute; left: 80px; top: 120px; font-size: 140px; line-height: 1; gap: 22px; }
  #og .wm svg { width: 104px; height: 58px; margin-top: 18px; }
  #og .tag { position: absolute; left: 80px; top: 366px; width: 620px; font-size: 44px; line-height: 1.14; }
  #og .meta { position: absolute; left: 80px; top: 548px; font-size: 22px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="mk" viewBox="0 0 40 22"><path d="M3 2h34c-.9 4.6-4 8.6-8.7 8.6h-16.6C7 10.6 3.9 6.6 3 2z" fill="#F1FF62" stroke="#112358" stroke-width="1.4" stroke-linejoin="round" paint-order="stroke"/><path d="M19 10.6h2l-.4 7h-1.2z" fill="#F4F5FA"/><ellipse cx="20" cy="18" rx="4.6" ry="2" fill="#F4F5FA"/></symbol>
  </defs>
</svg>

<div class="art" id="thumb">
  <div class="water"></div>
  <p class="wm"><svg><use href="#mk"/></svg>Keel</p>
  <p class="tag">A budgeting app that tells you you’re okay <em>before anything else.</em></p>
  <p class="meta">UX and visual design · Motion system · Working prototype</p>
  <div class="phone"><img src="img/app-home.png" alt=""></div>
</div>

<div class="art" id="og">
  <div class="water"></div>
  <p class="wm"><svg><use href="#mk"/></svg>Keel</p>
  <p class="tag">A budgeting app that tells you you’re okay <em>before anything else.</em></p>
  <p class="meta">UX and visual design case study · Shyine Makin</p>
  <div class="phone"><img src="img/app-home.png" alt=""></div>
</div>
</body>
</html>
