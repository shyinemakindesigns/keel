<!doctype html>
<!--
  Animated Wix thumbnail, 1600 x 1200, 30fps, loops without a seam.
  The static thumbnail's layout (thumb-bg.png: thumbnail.html #thumb with the phone and mark hidden),
  the hull mark bobbing once per loop, and the phone playing the recording from record-thumb.mjs:
  check a $250 purchase, the keel previews it (9 days of room to 4), clear, it settles back.
  Serve a folder holding this file, thumb-bg.png, rec-thumb/ and node_modules/mp4-muxer, then:
    node encode.mjs keel-thumbnail-loop.mp4 thumbloop.html
-->
<html><head><meta charset="utf-8">
<style>body{margin:0;background:#111}canvas{display:block}</style></head>
<body><canvas id="c" width="1600" height="1200"></canvas>
<script type="module">
import { Muxer, ArrayBufferTarget } from '/node_modules/mp4-muxer/build/mp4-muxer.mjs';

const W = 1600, H = 1200, FPS = 30;
const MARK = { x: 110, y: 313, w: 170, h: 94 };              // viewBox 40 x 22
const PHONE = { x: 980, y: 180, w: 524, h: 1104, r: 56 };    // 2 px border
const SCREEN = { x: 982, y: 182, w: 520, h: 1100, r: 54 };
const SCALE = SCREEN.w / 390;                                  // css px of the app to video px

const status = (m) => { document.title = m; window.__status = m; };
const j = (u) => fetch(u).then((r) => r.json());
const [frames, taps, meta] = await Promise.all([j('rec-thumb/frames.json'), j('rec-thumb/taps.json'), j('rec-thumb/meta.json')]);
const T = meta.duration;                                       // one loop
const bg = await createImageBitmap(await (await fetch('thumb-bg.png')).blob());
const ctx = document.getElementById('c').getContext('2d');
const first = await createImageBitmap(await (await fetch('rec-thumb/frames/' + frames[0].f)).blob());

let cur = null, curName = null;
async function appFrame(t) {
  let f = frames[0];
  for (let i = 0; i < frames.length && frames[i].t <= t; i++) f = frames[i];
  if (f.f !== curName) { const blob = await (await fetch('rec-thumb/frames/' + f.f)).blob(); if (cur) cur.close(); cur = await createImageBitmap(blob); curName = f.f; }
  return cur;
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
const ease = (k) => 1 - Math.pow(1 - k, 3);

function mark(dy) {
  const s = MARK.w / 40;
  ctx.save(); ctx.translate(MARK.x, MARK.y + (MARK.h - 22 * s) / 2 + dy); ctx.scale(s, s);
  const hull = new Path2D('M3 2h34c-.9 4.6-4 8.6-8.7 8.6h-16.6C7 10.6 3.9 6.6 3 2z');
  ctx.lineJoin = 'round'; ctx.lineWidth = 1.4; ctx.strokeStyle = '#112358'; ctx.stroke(hull);   // paint-order: stroke, then fill
  ctx.fillStyle = '#F1FF62'; ctx.fill(hull);
  ctx.fillStyle = '#F4F5FA'; ctx.fill(new Path2D('M19 10.6h2l-.4 7h-1.2z'));
  ctx.beginPath(); ctx.ellipse(20, 18, 4.6, 2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

async function draw(t) {
  ctx.drawImage(bg, 0, 0);
  // the hull floats: one slow bob per loop, so the last frame meets the first
  mark(-Math.sin((t / T) * Math.PI * 2) * 4);
  // phone
  rr(PHONE.x, PHONE.y, PHONE.w, PHONE.h, PHONE.r); ctx.fillStyle = 'rgba(244,245,250,0.22)'; ctx.fill();
  ctx.save(); rr(SCREEN.x, SCREEN.y, SCREEN.w, SCREEN.h, SCREEN.r); ctx.clip();
  ctx.fillStyle = '#F4F5FA'; ctx.fillRect(SCREEN.x, SCREEN.y, SCREEN.w, SCREEN.h);
  const img = await appFrame(t);
  ctx.drawImage(img, SCREEN.x, SCREEN.y, SCREEN.w, img.height * (SCREEN.w / img.width));
  // the wrap: in the last 0.4s (the screen is at rest) fade back into frame zero, so the final
  // frame meets the first exactly, sub-pixel text differences included
  const FADE = 0.4;
  if (t > T - FADE) {
    ctx.globalAlpha = Math.min(1, (t - (T - FADE)) / FADE);
    ctx.drawImage(first, SCREEN.x, SCREEN.y, SCREEN.w, first.height * (SCREEN.w / first.width));
    ctx.globalAlpha = 1;
  }
  for (const p of taps) {          // a soft navy ring where a finger lands
    const dt = t - p.t; if (dt < 0 || dt > 0.55) continue;
    const k = dt / 0.55, x = SCREEN.x + p.x * SCALE, y = SCREEN.y + p.y * SCALE;
    ctx.beginPath(); ctx.arc(x, y, 16 + 14 * ease(k), 0, Math.PI * 2);
    ctx.fillStyle = `rgba(17,35,88,${0.18 * (1 - k)})`; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = `rgba(17,35,88,${0.4 * (1 - k)})`; ctx.stroke();
  }
  ctx.restore();
}

const params = new URLSearchParams(location.search);
if (params.has('still')) { await draw(parseFloat(params.get('still'))); status('still-done'); }
else {
  const muxer = new Muxer({ target: new ArrayBufferTarget(), video: { codec: 'avc', width: W, height: H, frameRate: FPS }, fastStart: 'in-memory' });
  const encoder = new VideoEncoder({ output: (chunk, m) => muxer.addVideoChunk(chunk, m), error: (e) => status('encode-error ' + e.message) });
  encoder.configure({ codec: 'avc1.640028', width: W, height: H, bitrate: 5_000_000, framerate: FPS, latencyMode: 'quality' });
  const N = Math.round(T * FPS);   // frame N would equal frame 0, so stop one short: the player's wrap is the seam
  for (let i = 0; i < N; i++) {
    await draw(i / FPS);
    const vf = new VideoFrame(document.getElementById('c'), { timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
    encoder.encode(vf, { keyFrame: i % (FPS * 2) === 0 }); vf.close();
    while (encoder.encodeQueueSize > 8) await new Promise((r) => setTimeout(r, 2));
    if (i % 30 === 0) status(`frame ${i}/${N}`);
  }
  await encoder.flush(); muxer.finalize();
  window.__mp4 = new Uint8Array(muxer.target.buffer);
  window.__mp4b64 = (start, len) => { let s = ''; const a = window.__mp4.subarray(start, start + len); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
  status('done ' + window.__mp4.length + ' bytes, ' + N + ' frames, ' + T.toFixed(2) + 's');
}
</script></body></html>
