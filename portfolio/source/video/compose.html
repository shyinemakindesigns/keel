<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://api.fontshare.com/v2/css?f[]=switzer@400,401,500,501,600&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#111}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1350"></canvas>
<script type="module">
import { Muxer, ArrayBufferTarget } from '/node_modules/mp4-muxer/build/mp4-muxer.mjs';

const W = 1080, H = 1350, FPS = 30;
const C = { canvas: '#0B1530', raised: '#112358', deep: '#1A2E66', text: '#F4F5FA', muted: '#AEB9D6', signal: '#F1FF62', ocean: '#3DB8EA' };   // Harbor & Signal, dark
const SCREEN = { x: 456, y: 74, w: 556, h: 1203 };            // 390 x 844 app at 1.4256x
const S = SCREEN.w / 390;
const FRAME = { x: SCREEN.x - 12, y: SCREEN.y - 12, w: SCREEN.w + 24, h: SCREEN.h + 24 };
const WATER_Y = 1040;
const END_HOLD = 4.2;

const CAPTIONS = {
  hook:     ['Most budgeting apps meet a hard week with red numbers.', 'So people stop looking, right when they most need to.'],
  onboard:  ['Keel starts somewhere calmer.', 'Four short steps. Sample data only.'],
  reading:  ['One answer first: how long you’re covered.', 'Steady through Oct 25, nine days past payday.'],
  check:    ['Check a purchase before you buy.', 'A $250 spend moves the keel and the date before it happens.'],
  spending: ['Spending in days, not red overages.', '$16.80 of sushi is about a third of a day.'],
  goals:    ['Saving without the confetti.', 'Add $100 and see what it does to your reading.'],
  plan:     ['Try a plan before you commit.', '$100 more a paycheck, compared side by side.'],
  end:      ['Read the case study. Try the prototype.', 'Links in the comments.'],
};

const status = (m) => { document.title = m; window.__status = m; };
const j = (u) => fetch(u).then((r) => r.json());
const [frames, taps, scenes] = await Promise.all([j('rec/frames.json'), j('rec/taps.json'), j('rec/scenes.json')]);
await document.fonts.load('400 50px Switzer'); await document.fonts.load('600 40px Switzer');
await document.fonts.load('400 24px Switzer'); await document.fonts.load('500 22px Switzer');

const endT = scenes.find((s) => s.id === 'end').t;
const total = endT + END_HOLD;
const sceneAt = (t) => { let cur = scenes[0]; for (const s of scenes) if (s.t <= t) cur = s; return cur; };

const ctx = document.getElementById('c').getContext('2d');
let curFrame = null, curName = null;
async function appFrame(t) {
  let f = frames[0];
  for (let i = 0; i < frames.length && frames[i].t <= t; i++) f = frames[i];
  if (f.f !== curName) {
    const blob = await (await fetch('rec/frames/' + f.f)).blob();
    if (curFrame) curFrame.close();
    curFrame = await createImageBitmap(blob); curName = f.f;
  }
  return curFrame;
}

function wrap(text, font, maxW) {
  ctx.font = font; const words = text.split(' '); const lines = []; let line = '';
  for (const w of words) { const test = line ? line + ' ' + w : w; if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test; }
  if (line) lines.push(line); return lines;
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
const ease = (k) => { // cubic-bezier(.2,.7,.2,1) approximated by solving for t
  let lo = 0, hi = 1, t = k; for (let i = 0; i < 20; i++) { t = (lo + hi) / 2; const x = 3 * (1 - t) * (1 - t) * t * 0.2 + 3 * (1 - t) * t * t * 0.2 + t * t * t; if (x < k) lo = t; else hi = t; }
  return 3 * (1 - t) * (1 - t) * t * 0.7 + 3 * (1 - t) * t * t * 1 + t * t * t;
};

function keelMark(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = C.text; ctx.lineWidth = 1.6; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(4, 15); ctx.lineTo(28, 15); ctx.stroke();
  ctx.fillStyle = C.signal; ctx.fill(new Path2D('M6 12.5h20c-.6 3.4-2.6 5-5.2 5H11.2c-2.6 0-4.6-1.6-5.2-5z'));
  ctx.fillStyle = C.text; ctx.fill(new Path2D('M15 17.5h2l-.4 7h-1.2z')); ctx.beginPath(); ctx.ellipse(16, 25.2, 3, 1.3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

async function draw(t) {
  // background with the waterline motif
  ctx.fillStyle = C.canvas; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = C.raised; ctx.fillRect(0, WATER_Y, W, H - WATER_Y);
  ctx.fillStyle = C.text; ctx.fillRect(0, WATER_Y - 1, W, 2);

  // wordmark
  keelMark(56, 64, 1.7);
  ctx.fillStyle = C.text; ctx.font = '600 42px Switzer'; ctx.textBaseline = 'alphabetic'; ctx.fillText('Keel', 124, 104);

  // phone
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 60; ctx.shadowOffsetY = 24;
  rr(FRAME.x, FRAME.y, FRAME.w, FRAME.h, 66); ctx.fillStyle = C.deep; ctx.fill(); ctx.restore();
  rr(FRAME.x + 0.75, FRAME.y + 0.75, FRAME.w - 1.5, FRAME.h - 1.5, 66); ctx.strokeStyle = 'rgba(244,245,250,0.16)'; ctx.lineWidth = 1.5; ctx.stroke();
  const tApp = Math.min(t, endT);
  const img = await appFrame(tApp);
  ctx.save(); rr(SCREEN.x, SCREEN.y, SCREEN.w, SCREEN.h, 54); ctx.clip();
  ctx.drawImage(img, SCREEN.x, SCREEN.y, SCREEN.w, SCREEN.h);
  // touch indicators
  for (const p of taps) {
    const dt = tApp - p.t; const life = p.drag ? 0.35 : 0.55;
    if (dt < 0 || dt > life) continue;
    const k = dt / life;
    const x = SCREEN.x + p.x * S, y = SCREEN.y + p.y * S;
    ctx.beginPath(); ctx.arc(x, y, 18 + 16 * ease(k), 0, Math.PI * 2);
    ctx.fillStyle = `rgba(17,35,88,${0.22 * (1 - k)})`; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = `rgba(17,35,88,${0.45 * (1 - k)})`; ctx.stroke();
  }
  ctx.restore();

  // caption: fades and rises in over 420ms (ease-settle) at each scene start
  const sc = t >= endT ? { id: 'end', t: endT } : sceneAt(t);
  const [head, sub] = CAPTIONS[sc.id];
  const k = Math.min(1, (t - sc.t) / 0.42), e = sc.id === 'hook' ? 1 : ease(Math.max(0, k)); // the opening frame carries the hook, fully visible
  const order = ['onboard', 'reading', 'check', 'spending', 'goals', 'plan'];
  const colX = 56, colW = 352;
  const hLines = wrap(head, '400 50px Switzer', colW), sLines = wrap(sub, '400 25px Switzer', colW);
  const blockH = hLines.length * 56 + 22 + sLines.length * 34;
  const baseY = WATER_Y - 64 - blockH + (1 - e) * 14;
  ctx.globalAlpha = e;
  const idx = order.indexOf(sc.id);
  if (idx >= 0) { ctx.fillStyle = C.signal; ctx.font = '400 24px Switzer'; ctx.fillText(String(idx + 1).padStart(2, '0') + '  /  06', colX, baseY - 30); }
  ctx.fillStyle = C.text; ctx.font = '400 50px Switzer';
  hLines.forEach((l, i) => ctx.fillText(l, colX, baseY + 44 + i * 56));
  ctx.fillStyle = C.muted; ctx.font = '400 25px Switzer';
  sLines.forEach((l, i) => ctx.fillText(l, colX, baseY + hLines.length * 56 + 22 + 26 + i * 34));
  ctx.globalAlpha = 1;

  // footer in the water band
  ctx.fillStyle = C.muted; ctx.font = '400 21px Switzer';
  ctx.fillText('A calm money app concept.', colX, WATER_Y + 64);
  ctx.fillText('UX and visual design case study', colX, WATER_Y + 94);
  ctx.fillText('by Shyine Makin', colX, WATER_Y + 124);
  if (t >= endT) {
    const ke = ease(Math.min(1, (t - endT) / 0.5));
    ctx.globalAlpha = ke; ctx.fillStyle = C.signal; ctx.font = '600 22px Switzer';
    ctx.fillText('keel-casestudy.vercel.app', colX, WATER_Y + 176); ctx.globalAlpha = 1;
  }
}

// --- render and encode -----------------------------------------------------
const params = new URLSearchParams(location.search);
if (params.has('still')) {           // render one moment for review: ?still=12.5
  await draw(parseFloat(params.get('still'))); status('still-done');
} else {
  const muxer = new Muxer({ target: new ArrayBufferTarget(), video: { codec: 'avc', width: W, height: H, frameRate: FPS }, fastStart: 'in-memory' });
  const encoder = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: (e) => status('encode-error ' + e.message) });
  encoder.configure({ codec: 'avc1.640028', width: W, height: H, bitrate: 9_000_000, framerate: FPS, latencyMode: 'quality' });
  const N = Math.round(total * FPS);
  for (let i = 0; i < N; i++) {
    await draw(i / FPS);
    const vf = new VideoFrame(document.getElementById('c'), { timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
    encoder.encode(vf, { keyFrame: i % (FPS * 2) === 0 }); vf.close();
    while (encoder.encodeQueueSize > 8) await new Promise((r) => setTimeout(r, 2));
    if (i % 30 === 0) status(`frame ${i}/${N}`);
  }
  await encoder.flush(); muxer.finalize();
  window.__mp4 = new Uint8Array(muxer.target.buffer);
  window.__mp4b64 = (start, len) => { let s = ''; const a = window.__mp4.subarray(start, start + len); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
  status('done ' + window.__mp4.length + ' bytes, ' + N + ' frames, ' + total.toFixed(2) + 's');
}
</script></body></html>
